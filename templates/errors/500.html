{% extends 'base.html' %}
{% block title %}Server Error - AI Voice Assistant{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-12rem)] flex flex-col items-center justify-center text-center px-4">
    <div class="w-20 h-20 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center text-3xl mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white mb-2">500 - Internal Server Error</h1>
    <p class="text-slate-600 dark:text-slate-400 max-w-md mb-6 text-sm">
        An unexpected error occurred while processing your request. Our technical team has been notified.
    </p>
    <a href="{{ url_for('main.index') }}" class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-all shadow-md">
        Back to Dashboard
    </a>
</div>
{% endblock %}
