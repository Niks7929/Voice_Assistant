{% extends 'base.html' %}

{% block title %}Sign In - CodeVocalis AI{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-5rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full rounded-3xl border border-slate-800 bg-slate-900/90 backdrop-blur-xl p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white text-2xl shadow-lg shadow-indigo-500/25">
                <i class="fa-solid fa-code"></i>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight">Sign In to CodeVocalis</h2>
            <p class="mt-1 text-xs text-slate-400">Access your personalized developer voice assistant</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 mb-1">
                    Username or Email
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user text-xs"></i>
                    </div>
                    <input id="username" name="username" type="text" required value="{{ username if username else '' }}"
                        class="block w-full pl-10 pr-4 py-3 rounded-xl border border-slate-800 bg-slate-950 text-white placeholder:text-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-xs transition-all outline-none"
                        placeholder="developer@example.com or username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 mb-1">
                    Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </div>
                    <input id="password" name="password" type="password" required
                        class="block w-full pl-10 pr-4 py-3 rounded-xl border border-slate-800 bg-slate-950 text-white placeholder:text-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-xs transition-all outline-none"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 font-bold text-xs shadow-lg shadow-indigo-500/25 transition-all">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </div>
        </form>

        <!-- Switch to Register -->
        <p class="text-center text-xs text-slate-400">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="font-bold text-indigo-400 hover:text-indigo-300 transition-colors">
                Create one now
            </a>
        </p>
    </div>
</div>
{% endblock %}
